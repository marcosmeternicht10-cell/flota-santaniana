<!--
  Borrar rendiciones y deshacer liquidaciones.
  Va en la pantalla "Corporativos → Resumen de rendiciones".
-->


<!-- ══ A) Columna de acciones en la tabla de detalle ═════════════════════
     Agregá esta celda al final de cada fila (y un <th></th> en el header). -->

<td class="celda-acciones">
  {% if not r.liquidado %}
    <button class="btn-icono btn-borrar"
            onclick="borrarRendicion({{ r.id }}, this)"
            title="Borrar esta rendición"
            aria-label="Borrar rendición del {{ r.fecha }}">✕</button>
  {% else %}
    <span class="candado" title="Liquidada — deshacé la liquidación para editarla">🔒</span>
  {% endif %}
</td>


<!-- ══ B) Liquidaciones hechas ══════════════════════════════════════════ -->

<button class="btn-secundario" onclick="abrirLiquidaciones()">Liquidaciones</button>

<div id="panelLiquidaciones" class="liq-panel" hidden>
  <div class="liq-cab">
    <h3>Liquidaciones pagadas</h3>
    <p>Deshacer una devuelve esos servicios al acumulado del chofer. No borra nada.</p>
  </div>
  <div id="liqCuerpo">Cargando…</div>
  <div class="liq-pie">
    <button class="btn-primario" onclick="cerrarLiquidaciones()">Listo</button>
  </div>
</div>


<style>
.celda-acciones { width: 44px; text-align: center; }
.btn-icono {
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: .2rem .45rem;
  cursor: pointer;
  color: var(--texto-tenue, #6b7280);
  line-height: 1;
}
.btn-borrar:hover, .btn-borrar:focus-visible {
  color: #b91c1c;
  border-color: #fca5a5;
  background: #fef2f2;
}
.candado { opacity: .4; font-size: .85rem; }

.liq-panel {
  margin: 1.25rem 0;
  padding: 1.25rem;
  background: var(--superficie, #fff);
  border: 1px solid var(--borde, #e2e5ea);
  border-radius: var(--radio, 12px);
  box-shadow: var(--sombra-media, 0 4px 16px rgba(20, 30, 55, .08));
}
.liq-cab h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
.liq-cab p  { margin: 0 0 1rem; font-size: .85rem; color: var(--texto-tenue, #6b7280); }
.liq-panel table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.liq-panel th {
  text-align: left;
  font-size: .7rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--texto-tenue, #6b7280);
  padding-bottom: .4rem;
  border-bottom: 1px solid var(--borde, #e2e5ea);
}
.liq-panel td { padding: .5rem 0; border-bottom: 1px solid var(--borde, #eef0f4); }
.liq-panel td.num { text-align: right; font-variant-numeric: tabular-nums; }
.liq-pie { display: flex; justify-content: flex-end; margin-top: 1rem; }
</style>


<script>
const g = n => Number(n || 0).toLocaleString('es-PY');

/* ── Borrar una rendición ─────────────────────────────────────────────── */

async function borrarRendicion(id, btn) {
  const fila = btn.closest('tr');
  const tramo = fila.querySelector('td:nth-child(4)')?.textContent.trim() || 'esta rendición';

  if (!confirm(`Borrar ${tramo}?\n\nSe va del sistema y el chofer va a poder volver a cargar ese tramo en esa fecha.`)) return;

  btn.disabled = true;
  try {
    const r = await fetch(`/api/corp/rendicion/${id}`, { method: 'DELETE' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo borrar');
    fila.remove();
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
  }
}

/* ── Liquidaciones ────────────────────────────────────────────────────── */

async function abrirLiquidaciones() {
  const panel = document.getElementById('panelLiquidaciones');
  const cuerpo = document.getElementById('liqCuerpo');
  panel.hidden = false;
  cuerpo.textContent = 'Cargando…';

  try {
    const r = await fetch('/api/corp/liquidaciones');
    const { liquidaciones } = await r.json();

    if (!liquidaciones.length) {
      cuerpo.textContent = 'Todavía no hay liquidaciones pagadas.';
      return;
    }

    cuerpo.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Chofer</th><th>Período</th><th>Pagada</th>
            <th class="num">Serv.</th><th class="num">Total</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${liquidaciones.map(l => `
            <tr>
              <td>${l.chofer}</td>
              <td>${l.desde} a ${l.hasta}</td>
              <td>${l.pagada_el}</td>
              <td class="num">${l.servicios}</td>
              <td class="num">${g(l.total)}</td>
              <td class="num">
                <button class="btn-icono btn-borrar"
                        onclick="deshacerLiquidacion('${l.chofer.replace(/'/g, "\\'")}', '${l.pagada_el}', this)">
                  Deshacer
                </button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    cuerpo.textContent = 'No se pudieron leer las liquidaciones. Probá de nuevo.';
  }
}

async function deshacerLiquidacion(chofer, pagada_el, btn) {
  if (!confirm(`Deshacer la liquidación de ${chofer} del ${pagada_el}?\n\nEsos servicios vuelven a aparecer como pendientes en el celular del chofer.`)) return;

  btn.disabled = true;
  try {
    const r = await fetch('/api/corp/liquidacion', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chofer, pagada_el }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo deshacer');
    alert(data.mensaje);
    location.reload();
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
  }
}

function cerrarLiquidaciones() {
  document.getElementById('panelLiquidaciones').hidden = true;
}
</script>
